[project]
name = "rig-dorpsplein"
version = "2025.2-b.1"
requires-python = ">=3.13"
dependencies = [
  "django-compressor~=4.5.1",
  "django[argon2]~=5.1.6",
  "environs[django]~=14.1.1",
  "uuid-utils~=0.10.0",
  "uvicorn-worker~=0.3.0",
  "uvicorn[standard]~=0.34.0",
]

[dependency-groups]
dev = [
  "pre-commit>=4.1.0",
  {include-group="lint"},
  {include-group="local"},
  {include-group="test"},
]
lint = [
  "djlint>=1.36.4",
  "pyright>=1.1.394",
  "ruff>=0.9.7",
]
local = [
    "django-extensions>=3.2.3",
]
test = [
  "django-coverage-plugin>=3.1.0",
  "pytest>=8.3.4",
  "pytest-django>=4.10.0",
  "pytest-sugar>=1.0.0",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint]
select = [
  "F",    # pyflakes
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "UP",   # pyupgrade
  "I",    # isort
  "N",    # pep8-naming
  "TRY",  # tryceratops
  "ERA",  # eradicate
  "PD",   # pandas-vet
  "NPY",  # numpy-specific rules
  "PGH",  # pygrep-hooks
  "PL",   # pylint
  "FLY",  # flynt
  "PERF", # perflint
  "RUF",  # ruff-specific rules
  # flake8
  "S",    # flake8-bandit
  "DJ",   # flake8-django
  "B",    # flake8-bugbear
  "C40",  # flake8-comprehensions
  "ISC",  # flake8-implicit-str-concat
  "T20",  # flake8-print
  "RET",  # flake8-return
  "PTH",  # flake8-use-pathlib
  "YTT",  # flake8-2020
  "BLE",  # flake8-blind-except
  "T10",  # flake8-debugger
  "EXE",  # flake8-executable
  "FA",   # flake8-future-annotations
  "ISC",  # flake8-implicit-str-concat
  "ICN",  # flake8-import-conventions (ICN)
  "G",    # flake8-logging-format
  "INP",  # flake8-no-pep420
  "PIE",  # flake8-pie
  "PYI",  # flake8-pyi
  "PT",   # flake8-pytest-style
  "Q",    # flake8-quotes
  "RSE",  # flake8-raise
  "SLF",  # flake8-self
  "SLOT", # flake8-slot
  "SIM",  # flake8-simplify
  "TID",  # flake8-tidy-imports
  "INT",  # flake8-gettext
  "A",    # flake8-builtins
  "C4",   # flake8-comprenhensions
  "DTZ",  # flake8-datetimez
  "LOG",  # flake8-logging
]
ignore = [
  "RUF012",  # Mutable class attributes should be annotated with `typing.ClassVar`
]

[tool.djlint]
format_css = true
format_js = true
indent = 2
profile = "django"

[tool.djlint.css]
indent_size=2

[tool.djlint.js]
indent_size = 2

[tool.pyright]
venvPath = "."
venv = ".venv"
